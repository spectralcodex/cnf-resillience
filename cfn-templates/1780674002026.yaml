AWSTemplateFormatVersion: '2010-09-09'
Description: 'ALB with two HTTP listeners on Port 80 and Port 5000.'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  Subnets:
    Type: List<AWS::EC2::Subnet::Id>

Resources:
  # ALB Security Group (Open to public internet on 80 and 5000)
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Allow public HTTP traffic to the ALB'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          CidrIp: 0.0.0.0/0

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: my-http-5000-alb
      Type: application
      Scheme: internet-facing
      Subnets: !Ref Subnets
      SecurityGroups:
        - !Ref AlbSecurityGroup

  # Target Groups (Both must be HTTP protocol for ALB)
  HttpTargetGroup80:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: tg-alb-http-80
      Protocol: HTTP
      Port: 80
      VpcId: !Ref VpcId
      TargetType: instance

  HttpTargetGroup5000:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: tg-alb-http-5000
      Protocol: HTTP
      Port: 5000
      VpcId: !Ref VpcId
      TargetType: instance

  # Listeners (Both must be HTTP protocol for ALB)
  AlbListener80:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref HttpTargetGroup80

  AlbListener5000:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 5000
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref HttpTargetGroup5000

  # Instance Security Group (Strictly locked to ALB)
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Isolate instances to only accept traffic from the ALB'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroup
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

Outputs:
  LoadBalancerName:
    Value: !GetAtt ApplicationLoadBalancer.LoadBalancerName